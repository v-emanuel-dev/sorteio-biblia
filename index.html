  <style>
    /* Layout: uma folha de missal no centro; rubrica vermelha marca só a referência e a ação principal */
    :root {
      --paper: #eef0f3;
      --sheet: #fbfbfc;
      --ink: #1b1f2a;
      --muted: #5d6474;
      --rule: #d9dce3;
      --rubric: #a3221d;
      --rubric-soft: #f6e3e1;
      --on-rubric: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0f1218;
        --sheet: #171b24;
        --ink: #e8e9ee;
        --muted: #9aa1b2;
        --rule: #2a303c;
        --rubric: #e2776f;
        --rubric-soft: #3a2224;
        --on-rubric: #1a0d0c;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --paper: #0f1218;
      --sheet: #171b24;
      --ink: #e8e9ee;
      --muted: #9aa1b2;
      --rule: #2a303c;
      --rubric: #e2776f;
      --rubric-soft: #3a2224;
      --on-rubric: #1a0d0c;
      color-scheme: dark;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Spectral', Georgia, 'Times New Roman', serif;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 32px 48px;
      font-size: 17px;
    }

    .ref {
      text-wrap: balance;
      font-variant-numeric: lining-nums;
    }

    .label {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--sheet);
      border-color: var(--ink);
    }

    .btn-primary {
      background: var(--rubric);
      color: var(--on-rubric);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    :focus-visible {
      outline: 2px solid var(--rubric);
      outline-offset: 3px;
    }

    .draw-in {
      animation: drawIn .38s ease-out;
    }

    @keyframes drawIn {
      from {
        opacity: .35;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw-in {
        animation: none;
      }
    }

    .link-box {
      overflow-wrap: anywhere;
    }

    .tbtn[aria-pressed="true"] {
      background: var(--ink);
      color: var(--sheet);
    }

    .tbtn:hover {
      color: var(--ink);
    }

    .tbtn[aria-pressed="true"]:hover {
      color: var(--sheet);
    }

    html {
      font-size: 150%;
    }

    body {
      font-size: 1.125rem;
    }

    .label {
      font-size: 0.75rem;
    }
  </style>

  <main class="mx-auto w-full max-w-xl flex flex-col gap-6">
    <header class="flex flex-col gap-1">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <p class="label font-body text-muted">Almeida Revista e Corrigida</p>
        <div class="theme-switch inline-flex rounded-full border border-rule bg-sheet p-0.5" role="group"
          aria-label="Aparência">
          <button type="button" id="t-system" data-t="system"
            class="tbtn font-body text-xs rounded-full px-2.5 py-1 text-muted">Sistema</button>
          <button type="button" id="t-light" data-t="light"
            class="tbtn font-body text-xs rounded-full px-2.5 py-1 text-muted">Claro</button>
          <button type="button" id="t-dark" data-t="dark"
            class="tbtn font-body text-xs rounded-full px-2.5 py-1 text-muted">Escuro</button>
        </div>
      </div>
      <h1 class="font-display text-2xl sm:text-3xl text-ink">Sorteio de passagem</h1>
      <p class="text-muted text-base leading-relaxed" id="intro">Uma passagem ao acaso, entre as mais conhecidas da
        Escritura. O link abre a leitura no Bíblia Online.</p>
    </header>

    <section aria-label="De onde sortear" class="flex flex-wrap gap-2" id="filters"></section>

    <section class="bg-sheet border border-rule rounded-md shadow-sm px-5 py-7 sm:px-8 sm:py-9 flex flex-col gap-6"
      aria-live="polite">
      <div id="result" class="flex flex-col gap-2">
        <p class="label text-muted" id="testament">Novo Testamento</p>
        <h2 class="ref font-display text-rubric text-3xl sm:text-4xl leading-tight" id="title">—</h2>
        <p class="font-body text-xl text-ink" id="ref"></p>
        <p class="text-muted text-base" id="meta"></p>
      </div>

      <div class="border-t border-rule pt-4 flex flex-col gap-1">
        <p class="label text-muted">Link</p>
        <a id="link" href="#" target="_blank" rel="noopener"
          class="link-box font-mono text-sm text-ink underline decoration-rule underline-offset-4 hover:decoration-rubric"></a>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <button id="draw" type="button"
          class="btn-primary font-body font-semibold rounded-md px-4 py-3 text-base">Sortear
          outra</button>
        <a id="open" href="#" target="_blank" rel="noopener"
          class="text-center font-body font-medium rounded-md px-4 py-3 text-base border border-ink text-ink hover:bg-paper">Abrir
          leitura</a>
        <button id="copy" type="button"
          class="font-body font-medium rounded-md px-4 py-3 text-base border border-rule text-ink hover:bg-paper">Copiar</button>
      </div>
      <p id="toast" class="text-sm text-muted min-h-[1.25rem]" role="status"></p>
    </section>

    <section class="flex flex-col gap-3" id="history-wrap" hidden>
      <h2 class="label text-muted">Últimos sorteios</h2>
      <ol id="history" class="flex flex-col divide-y divide-rule border-y border-rule"></ol>
    </section>

    <footer class="text-sm text-muted leading-relaxed" id="foot"></footer>
  </main>

      ["ap", 16, 1, 16, "As seis primeiras taças da ira"],
      ["ap", 17, 6, 13, "O mistério explicado"],
      ["ap", 18, 1, 8, "Caiu Babilônia"],
      ["ap", 18, 9, 20, "O lamento sobre a Babilônia"],
      ["ap", 19, 11, 16, "O cavaleiro do cavalo branco"],
      ["ap", 20, 1, 6, "Satanás é preso"],
      ["ap", 21, 1, 7, "Novo céu e nova terra"],
      ["ap", 21, 9, 27, "A nova Jerusalém"],
      ["ap", 22, 6, 17, "Jesus vem"]
    ];

    const FILTERS = [
      { id: 'todos', label: 'Toda a Bíblia', test: () => true },
      { id: 'at', label: 'Antigo Testamento', test: g => !NT_GROUPS.has(g) },
      { id: 'nt', label: 'Novo Testamento', test: g => NT_GROUPS.has(g) },
      { id: 'evang', label: 'Evangelhos', test: g => g === 'evang' },
      { id: 'salmos', label: 'Salmos', test: g => g === 'salmos' },
      { id: 'prof', label: 'Profetas', test: g => g === 'prof' },
      { id: 'sap', label: 'Sapienciais', test: g => g === 'sap' },
      { id: 'cartas', label: 'Cartas', test: g => g === 'cartas' }
    ];

    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
    };

    let filter = store.get('sorteio.filter', 'todos');
    if (!FILTERS.some(f => f.id === filter)) filter = 'todos';
    let history = store.get('sorteio.hist4', []);
    let current = null;
    const $ = id => document.getElementById(id);
    const keyOf = p => p[0] + p[1] + ':' + p[2];

    function randInt(n) {
      if (window.crypto && crypto.getRandomValues) {
        const a = new Uint32Array(1), max = Math.floor(0xffffffff / n) * n;
        do { crypto.getRandomValues(a); } while (a[0] >= max);
        return a[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function verses(p) { const v = []; for (let i = p[2]; i <= p[3]; i++) v.push(i); return v; }
    function urlFor(p) {
      const base = BASE + encodeURIComponent(p[0]) + '/' + p[1];
      if (!p[2]) return base;
      return p[5] ? base + '/' + p[2] + '+' : base + '/' + verses(p).join(',') + '+';
    }
    function refFor(p) {
      const ab = BOOKS[p[0]][1];
      if (!p[2]) return ab + ' ' + p[1];
      if (p[5]) return ab + ' ' + p[1] + ',' + p[2] + '–' + p[5] + ',' + p[3];
      return ab + ' ' + p[1] + ',' + p[2] + (p[3] > p[2] ? '-' + p[3] : '');
    }
    function metaFor(p) {
      const name = BOOKS[p[0]][0];
      if (!p[2]) return 'Salmo ' + p[1];
      if (p[5]) return name + ', do capítulo ' + p[1] + ', versículo ' + p[2] + ', ao capítulo ' + p[5] + ', versículo ' + p[3];
      return name + ', capítulo ' + p[1] + ', versículos ' + p[2] + ' a ' + p[3];
    }

    function pool() {
      const f = FILTERS.find(x => x.id === filter);
      return PASSAGES.filter(p => f.test(BOOKS[p[0]][2]));
    }

    function draw() {
      const list = pool();
      let pick, tries = 0;
      do { pick = list[randInt(list.length)]; tries++; }
      while (current && list.length > 1 && keyOf(pick) === keyOf(current) && tries < 10);
      current = pick;
      render();
      history = [keyOf(pick), ...history.filter(k => k !== keyOf(pick))].slice(0, 6);
      store.set('sorteio.hist4', history);
      renderHistory();
    }

    function render() {
      const p = current;
      $('testament').textContent = NT_GROUPS.has(BOOKS[p[0]][2]) ? 'Novo Testamento' : 'Antigo Testamento';
      $('title').textContent = p[4];
      $('ref').textContent = refFor(p);
      $('meta').textContent = metaFor(p);
      const url = urlFor(p);
      $('link').href = url; $('link').textContent = url.replace('https://www.', '');
      $('open').href = url;
      $('toast').textContent = '';
      const r = $('result'); r.classList.remove('draw-in'); void r.offsetWidth; r.classList.add('draw-in');
    }

    function renderFilters() {
      $('filters').innerHTML = '';
      FILTERS.forEach(f => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.id = 'f-' + f.id;
        btn.className = 'chip font-body text-sm rounded-full border border-rule bg-sheet text-ink px-3 py-1.5 hover:border-ink';
        btn.textContent = f.label;
        btn.setAttribute('aria-pressed', String(f.id === filter));
        btn.addEventListener('click', () => { filter = f.id; store.set('sorteio.filter', filter); renderFilters(); draw(); });
        $('filters').appendChild(btn);
      });
    }

    function renderHistory() {
      const list = $('history');
      const items = history.slice(1).map(k => PASSAGES.find(p => keyOf(p) === k)).filter(Boolean);
      $('history-wrap').hidden = items.length === 0;
      list.innerHTML = '';
      items.forEach(p => {
        const li = document.createElement('li');
        li.className = 'flex items-baseline justify-between gap-3 py-2.5';
        const a = document.createElement('a');
        a.href = urlFor(p); a.target = '_blank'; a.rel = 'noopener';
        a.className = 'text-ink hover:text-rubric min-w-0';
        a.textContent = p[4];
        const s = document.createElement('span');
        s.className = 'font-mono text-xs text-muted shrink-0';
        s.textContent = refFor(p);
        li.append(a, s); list.appendChild(li);
      });
    }

    async function copy() {
      const p = current;
      const text = p[4] + ' — ' + refFor(p) + ' (ARC)\n' + urlFor(p);
      try {
        await navigator.clipboard.writeText(text);
        $('toast').textContent = 'Passagem e link copiados.';
      } catch {
        const sel = window.getSelection(), range = document.createRange();
        range.selectNodeContents($('result').parentElement);
        sel.removeAllRanges(); sel.addRange(range);
        $('toast').textContent = 'Não deu para copiar automaticamente. O texto ficou selecionado; copie pelo menu do aparelho.';
      }
    }

    $('foot').textContent = PASSAGES.length + ' passagens dos dois Testamentos, com títulos baseados nas divisões da Berean Standard Bible (domínio público). O link abre o capítulo no Bíblia Online, na Almeida Revista e Corrigida.';
    function applyTheme(t) {
      const root = document.documentElement;
      if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
      document.querySelectorAll('.tbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    }
    let theme = 'system';
    try { const t = localStorage.getItem('sorteio.theme'); if (t === 'light' || t === 'dark') theme = t; } catch { }
    applyTheme(theme);
    document.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => {
      theme = b.dataset.t; applyTheme(theme);
      try { theme === 'system' ? localStorage.removeItem('sorteio.theme') : localStorage.setItem('sorteio.theme', theme); } catch { }
    }));

    $('draw').addEventListener('click', draw);
    $('copy').addEventListener('click', copy);
    renderFilters();
    draw();
  </script>
